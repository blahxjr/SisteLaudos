name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'  # habilita cache nativo do actions/setup-node — mais eficiente que cache manual
      - name: Check Node version
        run: |
          set -e
          NODE_VER=$(node --version 2>/dev/null || true)
          if [ -z "$NODE_VER" ]; then
            echo "Node version must be >= 24. Found: none"
            exit 1
          fi
          # Strip leading 'v' if present
          NV=${NODE_VER#v}
          MAJOR=$(printf "%s" "$NV" | cut -d. -f1)
          # If MAJOR is not a number, fail
          if ! printf "%s" "$MAJOR" | grep -Eq '^[0-9]+$'; then
            echo "Node version must be >= 24. Found: $NV"
            exit 1
          fi
          if [ "$MAJOR" -lt 24 ]; then
            echo "Node version must be >= 24. Found: $NV"
            exit 1
          fi
          echo "Node version OK: $NV"
      - name: Install dependencies (deterministic)
        run: |
          set -e
          # npm ci é a única forma correta de instalar em CI — reproduzível via lockfile
          # Se este step falhar, é um sinal real de problema: não silenciar com fallback
          npm ci --prefer-offline --no-audit --no-fund
          # NÃO fazer npm install adicional pós-ci — viola o propósito do lockfile
          # Se algum pacote está faltando, o lockfile deve ser atualizado no dev e commitado
          echo "Installed top-level packages:"
          npm ls --depth=0 2>/dev/null || true
      - name: Lint / Build
        run: |
          # Ensure Prisma client is available for build (use project-installed Prisma)
          npx prisma generate || true
          # Use npx to run Next directly to avoid missing local bin in some runner states
          npx next build
      - name: Validate docs presence
        run: |
          test -f docs/vision-system.md && echo "vision ok" || (echo "missing vision" && exit 1)
          test -f docs/agents/agent-charter.md || (echo "missing agent-charter" && exit 1)
          test -f docs/qa/definition-of-done.md || (echo "missing DoD" && exit 1)
      - name: Validate governance
        run: |
          test -d adr || (echo "missing adr directory" && exit 1)
          COUNT=$(ls -1 adr 2>/dev/null | wc -l)
          if [ "$COUNT" -lt 1 ]; then echo "no ADR files found" && exit 1; fi
          test -f docker/initdb/01_init.sql || (echo "missing init SQL for dev DB" && exit 1)
      - name: Smoke (no tests configured)
        run: echo "No unit tests configured; ensure DoD and ADRs are present"
