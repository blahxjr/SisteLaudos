name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies (robust)
        run: |
          set -e
          # try clean ci first; if it fails, fall back to full install
          npm ci --prefer-offline=false --no-audit --no-fund || npm install --no-audit --no-fund --unsafe-perm
          # ensure native builds and binaries are ready
          npm rebuild || true
      - name: Debug node bins
        run: |
          ls -la node_modules/.bin || true
          echo 'Installed packages:'
          npm ls --depth=0 || true
      - name: Ensure Next is installed (idempotent)
        run: |
          npm install next --no-audit --no-fund || true
      - name: Debug next install
        run: ls -la node_modules/next || true
      - name: Ensure core deps present (fallback)
        run: |
          # If a representative frontend dep is missing, force a full install
          if [ ! -d "node_modules/clsx" ]; then
            echo "core deps missing; running npm install --force"
            npm install --no-audit --no-fund --force
          else
            echo "core deps present"
          fi
      - name: Aggressive fallback if critical modules still missing
        run: |
          MISSING=0
          for P in @prisma/client clsx lucide-react @radix-ui/react-dialog @zxing/browser; do
            node -e "try{require('./node_modules/'+process.argv[1]);}catch(e){process.exit(1)}" "$P" 2>/dev/null || MISSING=1
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "Some critical modules missing; doing aggressive reinstall"
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund --legacy-peer-deps
            npm rebuild || true
          else
            echo "All critical modules present"
          fi
        - name: Ensure runtime deps explicitly
          run: |
            echo "Installing explicit runtime deps: react react-dom and UI libs"
            npm install react react-dom clsx lucide-react @radix-ui/react-dialog @zxing/browser @prisma/client --no-audit --no-fund --legacy-peer-deps || true
            npm rebuild || true
            echo 'Final installed packages:'
            ls -la node_modules | sed -n '1,200p' || true
            npm ls --depth=0 || true
      - name: Lint / Build
        run: |
          npm run lint
          npm run build
      - name: Validate docs presence
        run: |
          test -f docs/vision-system.md && echo "vision ok" || (echo "missing vision" && exit 1)
          test -f docs/agents/agent-charter.md || (echo "missing agent-charter" && exit 1)
          test -f docs/qa/definition-of-done.md || (echo "missing DoD" && exit 1)
      - name: Validate governance
        run: |
          test -d adr || (echo "missing adr directory" && exit 1)
          COUNT=$(ls -1 adr 2>/dev/null | wc -l)
          if [ "$COUNT" -lt 1 ]; then echo "no ADR files found" && exit 1; fi
          test -f docker/initdb/01_init.sql || (echo "missing init SQL for dev DB" && exit 1)
      - name: Smoke (no tests configured)
        run: echo "No unit tests configured; ensure DoD and ADRs are present"
